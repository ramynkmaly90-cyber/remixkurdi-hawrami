<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>REMIX KURDI HAWRAMI</title>

<meta name="theme-color" content="#6a11cb">

<link rel="icon" href="images/logo.png">

<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<!-- Background -->

<div class="bg-gradient"></div>

<div class="bg-blur blur1"></div>
<div class="bg-blur blur2"></div>

<!-- Header -->

<header id="header">

<div class="logo-box">

<img
src="images/logo.png"
alt="REMIX KURDI HAWRAMI"
class="logo">

</div>

<nav>

<button class="menu-btn">

<i class="fa-solid fa-bars"></i>

</button>

</nav>

</header>

<!-- Hero -->

<section class="hero">

<div class="hero-light"></div>

<div class="hero-content">

<h1>

<span>REMIX</span>

<span>KURDI</span>

<span>HAWRAMI</span>

</h1>

<p>@REMIXKURDI_HAWRAMI</p>

</div>

<div class="hero-wave"></div>

</section>

<!-- New Songs -->

<section class="songs-section">

<div class="section-title">

<i class="fa-solid fa-fire"></i>

<h2>جدیدترین آهنگ‌ها</h2>

</div>

<div id="songsContainer" class="songs-grid">
    <!-- Song Card Template -->
<!-- آهنگ‌ها با JavaScript اینجا ساخته می‌شوند -->
</div>

</section>

<!-- Bottom Music Player -->

<div id="musicPlayer" class="music-player">

    <div class="player-left">

        <img
        id="playerCover"
        src="covers/default.jpg"
        class="player-cover"
        alt="cover">

        <div class="player-info">

            <h3 id="playerTitle">
                آهنگی انتخاب نشده
            </h3>

            <span id="playerArtist">
                REMIX KURDI HAWRAMI
            </span>

        </div>

    </div>

    <div class="player-center">

        <div class="player-buttons">

            <button id="prevBtn" class="control-btn">
                <i class="fa-solid fa-backward-step"></i>
            </button>

            <button id="playBtn" class="play-btn">
                <i class="fa-solid fa-play"></i>
            </button>

            <button id="nextBtn" class="control-btn">
                <i class="fa-solid fa-forward-step"></i>
            </button>

        </div>

        <div class="equalizer">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>

        <div class="progress-area">

            <span id="currentTime">0:00</span>

            <input
            type="range"
            id="progressBar"
            value="0">

            <span id="duration">0:00</span>

        </div>

    </div>

    <div class="player-right">

        <i class="fa-solid fa-volume-high"></i>

        <input
        type="range"
        id="volumeBar"
        min="0"
        max="100"
        value="100">

    </div>

</div>

<audio id="audioPlayer"></audio>
<script src="script.js"></script>

</body>

</html>
